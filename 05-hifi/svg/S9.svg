<circle cx="195" cy="747" r="8" fill="#EFE9DA"/>
<text x="195" y="768" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#8A8A8A" text-anchor="middle">Honor</text>
<circle cx="325" cy="747" r="8" fill="#0F1F38"/>
<text x="325" y="768" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#1F2733" text-anchor="middle">Schools</text>
