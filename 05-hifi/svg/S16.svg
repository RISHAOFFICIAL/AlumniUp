<svg xmlns="http://www.w3.org/2000/svg" width="390" height="655" viewBox="0 0 390 655">
<rect x="0" y="0" width="390" height="655" fill="#F8F7F5"/>
<rect x="0.75" y="0.75" width="388.5" height="653.5" fill="none" stroke="#BDBDBD" stroke-width="1.5"/>
<rect x="0" y="0" width="390" height="46" rx="0" fill="#0F1F38"/>
<rect x="0" y="45" width="390" height="1" rx="0" fill="#D8D2C0"/>
<text x="16" y="26" font-family="Cormorant Garamond, Georgia, serif" font-size="17" font-weight="700" fill="#F8F7F5" text-anchor="start">AlumniUp</text>
<rect x="308" y="11" width="24" height="24" rx="6" fill="#33507E"/>
<rect x="340" y="11" width="24" height="24" rx="6" fill="#33507E"/>
<text x="16" y="88" font-family="Cormorant Garamond, Georgia, serif" font-size="26" font-weight="700" fill="#0F1F38" text-anchor="start">Welcome back</text>
<text x="16" y="118" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1F2733" text-anchor="start">Sign in to track your gifts, post needs, or manage</text>
<text x="16" y="136" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1F2733" text-anchor="start">your school. Browsing and donating never require an</text>
<text x="16" y="154" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1F2733" text-anchor="start">account.</text>
<text x="16" y="180" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#5B6472" text-anchor="start">Email</text>
<rect x="16" y="187" width="358" height="44" rx="8" fill="#FFFFFF" stroke="#CFC7B2" stroke-width="1.5"/>
<text x="28" y="213" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8A8A8A" text-anchor="start">you@example.com</text>
<rect x="16" y="241" width="358" height="48" rx="12" fill="#0F1F38"/>
<text x="195" y="270" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Email Me a Sign-In Link</text>
<rect x="16" y="301" width="358" height="1" rx="0" fill="#D8D2C0"/>
<text x="16" y="325" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#5B6472" text-anchor="start">Password (optional)</text>
<rect x="16" y="332" width="358" height="44" rx="8" fill="#FFFFFF" stroke="#CFC7B2" stroke-width="1.5"/>
<text x="28" y="358" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8A8A8A" text-anchor="start">••••••••</text>
<rect x="16" y="386" width="358" height="48" rx="12" fill="#FFFFFF" stroke="#0F1F38" stroke-width="1.5"/>
<text x="195" y="415" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F1F38" text-anchor="middle">Sign In with Password</text>
<rect x="16" y="444" width="358" height="76" rx="8" fill="#F1EAD9"/>
<text x="26" y="463" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">Magic link is the default: no password to forget, and donor</text>
<text x="26" y="478" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">gifts are matched by email automatically. If social sign-in</text>
<text x="26" y="493" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">is ever added on iOS, Sign in with Apple is offered</text>
<text x="26" y="508" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">alongside it.</text>
<text x="16" y="541" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">New to AlumniUp? Registering a school starts on the For</text>
<text x="16" y="556" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">Schools tab. Donors get an account automatically at first</text>
<text x="16" y="571" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">donation.</text>
<rect x="0" y="585" width="390" height="54" rx="0" fill="#FFFFFF"/>
<rect x="0" y="585" width="390" height="1" rx="0" fill="#D8D2C0"/>
<circle cx="65" cy="601" r="8" fill="#0F1F38"/>
<text x="65" y="622" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#1F2733" text-anchor="middle">Home</text>
<circle cx="195" cy="601" r="8" fill="#EFE9DA"/>
<text x="195" y="622" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#8A8A8A" text-anchor="middle">Honor</text>
<circle cx="325" cy="601" r="8" fill="#EFE9DA"/>
<text x="325" y="622" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#8A8A8A" text-anchor="middle">Schools</text>
