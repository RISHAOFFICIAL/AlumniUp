<svg xmlns="http://www.w3.org/2000/svg" width="390" height="651" viewBox="0 0 390 651">
<rect x="0" y="0" width="390" height="651" fill="#FFFFFF"/>
<rect x="0.75" y="0.75" width="388.5" height="649.5" fill="none" stroke="#BDBDBD" stroke-width="1.5"/>
<rect x="0" y="0" width="390" height="46" rx="0" fill="#FFFFFF"/>
<rect x="0" y="45" width="390" height="1" rx="0" fill="#BDBDBD"/>
<text x="16" y="26" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#333333" text-anchor="start">AlumniUp</text>
<rect x="308" y="11" width="24" height="24" rx="6" fill="#E7E7E7"/>
<rect x="340" y="11" width="24" height="24" rx="6" fill="#E7E7E7"/>
<text x="16" y="85" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#333333" text-anchor="start">Welcome back</text>
<text x="16" y="114" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" text-anchor="start">Sign in to track your gifts, post needs, or manage</text>
<text x="16" y="132" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" text-anchor="start">your school. Browsing and donating never require an</text>
<text x="16" y="150" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" text-anchor="start">account.</text>
<text x="16" y="176" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6E6E6E" text-anchor="start">Email</text>
<rect x="16" y="183" width="358" height="44" rx="8" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1.5"/>
<text x="28" y="209" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9A9A9A" text-anchor="start">you@example.com</text>
<rect x="16" y="237" width="358" height="48" rx="10" fill="#4A4A4A"/>
<text x="195" y="266" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Email Me a Sign-In Link</text>
<rect x="16" y="297" width="358" height="1" rx="0" fill="#BDBDBD"/>
<text x="16" y="321" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6E6E6E" text-anchor="start">Password (optional)</text>
<rect x="16" y="328" width="358" height="44" rx="8" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1.5"/>
<text x="28" y="354" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9A9A9A" text-anchor="start">••••••••</text>
<rect x="16" y="382" width="358" height="48" rx="10" fill="#FFFFFF" stroke="#4A4A4A" stroke-width="1.5"/>
<text x="195" y="411" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#4A4A4A" text-anchor="middle">Sign In with Password</text>
<rect x="16" y="440" width="358" height="76" rx="8" fill="#F2F2F2"/>
<text x="26" y="459" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6E6E6E" text-anchor="start">Magic link is the default: no password to forget, and donor</text>
<text x="26" y="474" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6E6E6E" text-anchor="start">gifts are matched by email automatically. If social sign-in</text>
<text x="26" y="489" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6E6E6E" text-anchor="start">is ever added on iOS, Sign in with Apple is offered</text>
<text x="26" y="504" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6E6E6E" text-anchor="start">alongside it.</text>
<text x="16" y="537" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6E6E6E" text-anchor="start">New to AlumniUp? Registering a school starts on the For</text>
<text x="16" y="552" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6E6E6E" text-anchor="start">Schools tab. Donors get an account automatically at first</text>
<text x="16" y="567" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6E6E6E" text-anchor="start">donation.</text>
<rect x="0" y="581" width="390" height="54" rx="0" fill="#FFFFFF"/>
<rect x="0" y="581" width="390" height="1" rx="0" fill="#BDBDBD"/>
<circle cx="65" cy="597" r="8" fill="#4A4A4A"/>
<text x="65" y="618" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#333333" text-anchor="middle">Home</text>
<circle cx="195" cy="597" r="8" fill="#E7E7E7"/>
<text x="195" y="618" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#9A9A9A" text-anchor="middle">Honor</text>
<circle cx="325" cy="597" r="8" fill="#E7E7E7"/>
<text x="325" y="618" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#9A9A9A" text-anchor="middle">Schools</text>
</svg>